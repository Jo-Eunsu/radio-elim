name: Update YouTube thumbnails

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/update-youtube-thumbnails.yml"

permissions:
  contents: write

concurrency:
  group: youtube-thumbnail-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Build thumbnail map
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          CHANNEL_URL = "https://www.youtube.com/@radio_elim/videos"
          OUT = Path("youtube_thumbnails.json")

          result = subprocess.run(
              [
                  "yt-dlp",
                  "--flat-playlist",
                  "--dump-single-json",
                  "--ignore-errors",
                  "--no-warnings",
                  CHANNEL_URL,
              ],
              text=True,
              capture_output=True,
              check=False,
          )

          if result.returncode != 0 or not result.stdout.strip():
              print("YouTube 목록을 불러오지 못했습니다.")
              print(result.stderr[-4000:])
              sys.exit(1)

          try:
              playlist = json.loads(result.stdout)
          except Exception as exc:
              print("yt-dlp 결과 JSON 해석 실패:", exc)
              sys.exit(1)

          entries = playlist.get("entries") or []

          def normalize_episode(main, sub=None):
              main = str(int(main))
              if sub is None:
                  return main
              return f"{main}.{int(sub)}"

          def episode_from_title(title):
              title = (title or "").strip()

              patterns = [
                  r"^\s*(\d{1,3})(?:[._-](\d+))?\s*(?:회)?\s*[.\-:)]",
                  r"^\s*(\d{1,3})(?:[._-](\d+))?\s*회\b",
                  r"(?:라디오\s*엘림|RADIO\s*ELIM)\s*[#:_\- ]*\s*(\d{1,3})(?:[._-](\d+))?\s*회?",
              ]

              for pattern in patterns:
                  match = re.search(pattern, title, flags=re.I)
                  if match:
                      main = int(match.group(1))
                      if 1 <= main <= 999:
                          sub = match.group(2) if match.lastindex and match.lastindex >= 2 else None
                          return normalize_episode(match.group(1), sub)

              if "엘림" in title:
                  match = re.search(r"(?<!\d)(\d{1,3})(?:[._-](\d+))?(?!\d)", title)
                  if match:
                      main = int(match.group(1))
                      if 1 <= main <= 999:
                          return normalize_episode(match.group(1), match.group(2))

              return None

          existing = {}
          if OUT.exists():
              try:
                  existing = json.loads(OUT.read_text(encoding="utf-8"))
                  if not isinstance(existing, dict):
                      existing = {}
              except Exception:
                  existing = {}

          found = {}
          skipped = []

          for entry in entries:
              if not entry:
                  continue

              video_id = entry.get("id")
              title = entry.get("title") or ""

              if not video_id:
                  continue

              episode = episode_from_title(title)

              if not episode:
                  skipped.append(title)
                  continue

              found[episode] = {
                  "videoId": video_id,
                  "title": title,
                  "thumbnail": f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg",
                  "youtube": f"https://www.youtube.com/watch?v={video_id}",
              }

          if not found:
              print("회차 번호와 연결된 영상을 한 개도 찾지 못했습니다.")
              print("가져온 영상 수:", len(entries))
              print("예시 제목:", [e.get("title") for e in entries[:10] if e])
              sys.exit(1)

          merged = dict(existing)
          merged.update(found)

          def sort_key(item):
              try:
                  return float(item[0])
              except Exception:
                  return -1

          merged = dict(sorted(merged.items(), key=sort_key, reverse=True))

          OUT.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"이번 실행에서 찾은 회차: {len(found)}개")
          print(f"누적 저장된 썸네일: {len(merged)}개")
          if skipped:
              print(f"회차 번호를 못 찾은 YouTube 영상: {len(skipped)}개")
              print("예시:", skipped[:10])
          PY

      - name: Commit thumbnail map
        shell: bash
        run: |
          if git diff --quiet -- youtube_thumbnails.json; then
            echo "변경 사항 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube_thumbnails.json
          git commit -m "Update YouTube thumbnails"
          git push
